<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sabi Spin">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Sabi Spin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one-screen classroom app. Setup card first, then a play screen with the wheel as the hero and the question card below it; on wide screens (projector) wheel and card sit side by side. */
:root{
  --bg:#F2F5EF;
  --surface:#FFFFFF;
  --surface-2:#E6ECE3;
  --fg:#15241B;
  --muted:#5E6F63;
  --line:#CBD6C9;
  --accent:#E8642B;      /* sunset orange: spin + primary actions */
  --accent-ink:#FFFFFF;
  --green:#1E6B4A;       /* deep green: science, correct */
  --gold:#F2B134;        /* savanna gold: Africa, highlights */
  --ink-on-gold:#2B1D05;
  --wheel-a:#E8642B; --wheel-b:#F2B134; --wheel-c:#1E6B4A; --wheel-d:#2C6FB2;
  --wheel-used:#C9D1C7; --wheel-text:#FFFFFF; --wheel-used-text:#7A857B;
  --danger:#C73B2E;
  --display:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --shadow:0 10px 30px rgba(21,36,27,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A14; --surface:#18261E; --surface-2:#22332A; --fg:#EEF3EC; --muted:#A7B5AA; --line:#33463B;
    --accent:#F2793F; --accent-ink:#1A0D05; --green:#4FB386; --gold:#F5BE4A; --ink-on-gold:#2B1D05;
    --wheel-a:#F2793F; --wheel-b:#F5BE4A; --wheel-c:#3E9A70; --wheel-d:#5B8FD6;
    --wheel-used:#2E3D34; --wheel-text:#0F1A14; --wheel-used-text:#6E7F74; --danger:#E25C4F;
    --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A14; --surface:#18261E; --surface-2:#22332A; --fg:#EEF3EC; --muted:#A7B5AA; --line:#33463B;
  --accent:#F2793F; --accent-ink:#1A0D05; --green:#4FB386; --gold:#F5BE4A; --ink-on-gold:#2B1D05;
  --wheel-a:#F2793F; --wheel-b:#F5BE4A; --wheel-c:#3E9A70; --wheel-d:#5B8FD6;
  --wheel-used:#2E3D34; --wheel-text:#0F1A14; --wheel-used-text:#6E7F74; --danger:#E25C4F;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:inherit;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
#app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* ---------- Setup ---------- */
#setup{display:flex;flex-direction:column;gap:22px;padding-block:8px 24px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:2.4rem;color:var(--accent)}
.brand p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card .big{font-family:var(--display);font-size:1.3rem;font-weight:600}
.card .sub{color:var(--muted);font-size:.9rem}
.card[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.chip[data-group="Science"][aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--surface))}
.chip .count{color:var(--muted);font-weight:700;font-size:.85em}
.group-label{font-family:var(--display);font-weight:600;font-size:1.05rem;margin-top:4px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-start}
.teamnames{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.teamnames input{font:inherit;font-weight:700;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.primary{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:1.35rem;padding:16px 28px;border-radius:18px;box-shadow:var(--shadow)}
.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.ghost{border:2px solid var(--line);padding:9px 14px;font-weight:800;background:var(--surface)}
.footer-note{color:var(--muted);font-size:.9rem}

/* ---------- Play ---------- */
#play{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.topbar .where{display:flex;flex-direction:column;gap:2px;min-width:0}
.topbar .where strong{font-family:var(--display);font-size:1.3rem;font-weight:600}
.topbar .tools{display:flex;gap:8px}
.icon{width:42px;height:42px;border-radius:12px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:1.1rem}
.scores{display:flex;gap:8px;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800}
.score .n{font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.score.active{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.stage{display:grid;gap:18px;flex:1;min-height:0;align-content:start}
@media (min-width:860px){.stage{grid-template-columns:minmax(300px,440px) 1fr;align-items:center}}
.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.wheelbox{position:relative;width:min(82vw,360px);aspect-ratio:1;max-width:100%}
@media (min-width:860px){.wheelbox{width:min(100%,440px)}}
.wheelbox canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:var(--shadow)}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--fg);filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:var(--surface);border:4px solid var(--fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(1rem,4vw,1.5rem);z-index:2}
.left{color:var(--muted);font-weight:700;font-size:.95rem}
.qcard{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;min-height:220px;border:2px solid var(--line)}
#qbody{display:flex;flex-direction:column;gap:18px}
#qbody[hidden]{display:none}
.qcard .num{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qtext{margin:4px 0 0}
.qcard .num .badge{background:var(--gold);color:var(--ink-on-gold);font-family:var(--display);font-weight:700;padding:4px 12px;border-radius:999px}
.qtext{font-family:var(--display);font-weight:600;font-size:clamp(1.35rem,2.6vw,2rem);line-height:1.25}
.timer{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--green);border-radius:999px;transition:width .25s linear,background .3s}
.timer i.low{background:var(--danger)}
.tclock{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.answer{border-top:2px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:8px}
.answer .a{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,2.4vw,1.8rem);color:var(--green)}
.answer .w{color:var(--muted);margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.actions .primary{font-size:1.15rem;padding:13px 22px}
.btn-good{background:var(--green);color:#fff;font-weight:800;padding:13px 20px;font-size:1.1rem}
.btn-bad{background:var(--surface-2);color:var(--fg);font-weight:800;padding:13px 20px;font-size:1.1rem;border:2px solid var(--line)}
.placeholder{color:var(--muted);font-family:var(--display);font-weight:500;font-size:1.3rem;margin:auto 0;text-align:center}
.done{background:color-mix(in srgb,var(--gold) 20%,var(--surface));border:2px solid var(--gold);border-radius:16px;padding:14px 16px}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
.qcard.pop{animation:pop .25s ease-out}
@media (prefers-reduced-motion:reduce){.qcard.pop{animation:none}.card:hover{transform:none}}
</style>
</head>
<body>

<div id="app">
  <section id="setup">
    <div class="brand">
      <h1>Sabi Spin</h1>
      <p>Pick a group and a topic, spin the wheel, answer out loud.</p>
    </div>

    <div class="field">
      <span class="eyebrow">Who is playing?</span>
      <div class="cards" id="ageCards"></div>
    </div>

    <div class="field">
      <span class="eyebrow">Topic</span>
      <div class="group-label">Science</div>
      <div class="chips" id="sciChips"></div>
      <div class="group-label">Africa</div>
      <div class="chips" id="afrChips"></div>
    </div>

    <div class="row">
      <div class="field">
        <span class="eyebrow">Teams</span>
        <div class="seg" id="teamSeg">
          <button type="button" data-n="0" aria-pressed="true">No scoring</button>
          <button type="button" data-n="2">2</button>
          <button type="button" data-n="3">3</button>
          <button type="button" data-n="4">4</button>
        </div>
        <div class="teamnames" id="teamNames" hidden></div>
      </div>
      <div class="field">
        <span class="eyebrow">Answer timer</span>
        <div class="seg" id="timerSeg">
          <button type="button" data-s="0">Off</button>
          <button type="button" data-s="20">20 s</button>
          <button type="button" data-s="30" aria-pressed="true">30 s</button>
          <button type="button" data-s="45">45 s</button>
        </div>
      </div>
    </div>

    <div class="row" style="align-items:center">
      <button type="button" class="primary" id="startBtn" disabled>Start playing</button>
      <button type="button" class="ghost" id="resetBtn">Reset used questions</button>
      <button type="button" class="ghost" id="newBtn">New session</button>
    </div>
    <p class="footer-note" id="bankNote"></p>
  </section>

  <section id="play" hidden>
    <div class="topbar">
      <div class="where">
        <span class="eyebrow" id="ageLabel"></span>
        <strong id="topicLabel"></strong>
      </div>
      <div class="tools">
        <button type="button" class="icon" id="muteBtn" title="Sound on or off" aria-label="Toggle sound">🔊</button>
        <button type="button" class="icon" id="fsBtn" title="Fullscreen for the projector" aria-label="Fullscreen">⛶</button>
        <button type="button" class="ghost" id="changeBtn">Change topic</button>
      </div>
    </div>
    <div class="scores" id="scores" hidden></div>

    <div class="stage">
      <div class="wheelwrap">
        <div class="wheelbox">
          <div class="pointer"></div>
          <canvas id="wheel"></canvas>
          <div class="hub" id="hub">?</div>
        </div>
        <button type="button" class="primary" id="spinBtn">Spin the wheel</button>
        <span class="left" id="leftNote"></span>
      </div>

      <div class="qcard" id="qcard">
        <p class="placeholder" id="placeholder">Spin the wheel to get your first question.</p>
        <div id="qbody" hidden>
          <div class="num">
            <span class="badge" id="qnum">Question 1</span>
            <span class="tclock" id="tclock"></span>
          </div>
          <div class="timer" id="timerBar" hidden><i id="timerFill"></i></div>
          <p class="qtext" id="qtext"></p>
          <div class="answer" id="answerBox" hidden>
            <span class="eyebrow">Answer</span>
            <div class="a" id="atext"></div>
            <div class="w" id="wtext"></div>
          </div>
          <div class="actions" id="actions"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
const AGES=[
  {key:'j',name:'Juniors',sub:'ages 6–9'},
  {key:'m',name:'Middle',sub:'ages 10–13'},
  {key:'s',name:'Seniors',sub:'ages 14–17'}
];
const TOPICS=[
  {key:'bio',group:'Science',name:'Living Things',icon:'🌱'},
  {key:'earth',group:'Science',name:'Earth & Space',icon:'🪐'},
  {key:'matter',group:'Science',name:'Matter & Energy',icon:'⚡'},
  {key:'body',group:'Science',name:'Human Body',icon:'🫀'},
  {key:'geo',group:'Africa',name:'Geography of Africa',icon:'🗺️'},
  {key:'hist',group:'Africa',name:'African History',icon:'🏛️'},
  {key:'people',group:'Africa',name:'African Scientists & Inventors',icon:'🔬'},
  {key:'wild',group:'Africa',name:'African Nature & Wildlife',icon:'🦁'}
];

// q = question, a = answer, w = one line that teaches
const BANK={
bio:{
j:[
 {q:'What do plants need from the sun to make their food?',a:'Sunlight',w:'Plants mix sunlight, water and air to make sugar. That is called photosynthesis.'},
 {q:'Is a spider an insect?',a:'No',w:'Insects have 6 legs. Spiders have 8 legs and belong to a group called arachnids.'},
 {q:'Which animal starts life as a tadpole?',a:'A frog',w:'Frogs change shape as they grow. That change is called metamorphosis.'},
 {q:'What do we call animals that only eat plants?',a:'Herbivores',w:'Elephants, giraffes and cows are herbivores. Meat-eaters are carnivores.'},
 {q:'Which part of a plant drinks water from the soil?',a:'The roots',w:'Roots also hold the plant firmly in the ground.'},
 {q:'Do fish breathe with lungs or with gills?',a:'Gills',w:'Gills take oxygen out of the water as it flows past them.'},
 {q:'What is a baby butterfly called?',a:'A caterpillar',w:'It hatches from an egg, eats leaves, wraps itself in a chrysalis and comes out as a butterfly.'},
 {q:'Which one is a mammal: a shark, a dolphin or a crocodile?',a:'A dolphin',w:'Mammals breathe air and feed their babies milk. Dolphins do both.'}
],
m:[
 {q:'What is the name of the process plants use to make food from sunlight?',a:'Photosynthesis',w:'Chlorophyll in the leaves captures light and turns carbon dioxide and water into glucose.'},
 {q:'Which gas do plants release during photosynthesis?',a:'Oxygen',w:'Almost all the oxygen we breathe was made by plants and algae.'},
 {q:'What is the basic building block of all living things?',a:'The cell',w:'Some living things are a single cell. A human has around 30 trillion.'},
 {q:'What do we call an animal with no backbone?',a:'An invertebrate',w:'Insects, worms, snails and octopuses are invertebrates. They are over 95% of all animal species.'},
 {q:'Which part of the cell is called its "powerhouse"?',a:'The mitochondria',w:'They release energy from food in a process called respiration.'},
 {q:'True or false: bats are blind.',a:'False',w:'Bats can see. They also find insects in the dark using echoes, called echolocation.'},
 {q:'What word describes animals that are active at night?',a:'Nocturnal',w:'Owls, bats and bush babies are nocturnal.'},
 {q:'What molecule inside cells carries the instructions a living thing inherits?',a:'DNA',w:'DNA is a code copied into every new cell. Sections of it are called genes.'}
],
s:[
 {q:'Which molecule stores and carries energy inside cells? Give its three-letter name.',a:'ATP (adenosine triphosphate)',w:'Breaking a phosphate bond off ATP releases the energy a cell uses to work.'},
 {q:'In which part of a plant cell does photosynthesis happen?',a:'The chloroplast',w:'Chloroplasts contain chlorophyll, the green pigment that absorbs light.'},
 {q:'What is a sudden change in the DNA sequence called?',a:'A mutation',w:'Most mutations do nothing, some are harmful, and a few give an advantage. They are the raw material of evolution.'},
 {q:'Who published the theory of evolution by natural selection in 1859?',a:'Charles Darwin',w:'Alfred Russel Wallace reached the same idea independently and they announced it together in 1858.'},
 {q:'Name the four bases in DNA.',a:'Adenine, thymine, guanine and cytosine',w:'A always pairs with T and G with C. That pairing is how DNA copies itself.'},
 {q:'What is the process in which one cell divides into two identical cells?',a:'Mitosis',w:'Mitosis is for growth and repair. Meiosis makes sex cells with half the chromosomes.'},
 {q:'Are bacteria prokaryotes or eukaryotes?',a:'Prokaryotes',w:'Prokaryotic cells have no nucleus. Their DNA floats freely inside the cell.'},
 {q:'What are enzymes?',a:'Proteins that speed up chemical reactions',w:'Amylase in your saliva starts breaking down starch before you even swallow.'}
]},
earth:{
j:[
 {q:'What is the closest star to Earth?',a:'The Sun',w:'The Sun is a star like the ones you see at night, just much closer to us.'},
 {q:'How many planets are in our solar system?',a:'Eight',w:'Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.'},
 {q:'What is the big rock that goes around the Earth and shines at night?',a:'The Moon',w:'The Moon makes no light of its own. It reflects sunlight.'},
 {q:'What causes day and night?',a:'The Earth spinning',w:'The Earth turns all the way round once every 24 hours.'},
 {q:'Which planet is called the Red Planet?',a:'Mars',w:'Mars looks red because its dust is full of rusty iron.'},
 {q:'What is the biggest ocean in the world?',a:'The Pacific Ocean',w:'It is bigger than all the land on Earth put together.'},
 {q:'What do we call a mountain that can blow out hot melted rock?',a:'A volcano',w:'Melted rock that comes out of a volcano is called lava.'},
 {q:'What falls from a cloud when the tiny water drops get too heavy?',a:'Rain',w:'Clouds are made of millions of tiny water drops floating in the air.'}
],
m:[
 {q:'What is the largest planet in our solar system?',a:'Jupiter',w:'More than 1,300 Earths could fit inside Jupiter.'},
 {q:'What is the blanket of gases around the Earth called?',a:'The atmosphere',w:'It gives us air to breathe and protects us from most meteors and harmful rays.'},
 {q:'How long does the Earth take to go once around the Sun?',a:'One year (about 365¼ days)',w:'That extra quarter day is why we add a leap day every four years.'},
 {q:'What are the three main types of rock?',a:'Igneous, sedimentary and metamorphic',w:'Igneous rock cools from lava, sedimentary rock forms in layers, metamorphic rock is changed by heat and pressure.'},
 {q:'What is hot melted rock called while it is still underground?',a:'Magma',w:'Once it reaches the surface it is called lava.'},
 {q:'What causes the tides in the sea?',a:'The pull of the Moon\'s gravity',w:'The Sun helps too, which is why tides are strongest at full moon and new moon.'},
 {q:'Which planet is famous for its bright rings?',a:'Saturn',w:'The rings are made mostly of ice chunks, some as small as dust and some as big as houses.'},
 {q:'What is the imaginary line around the middle of the Earth called?',a:'The Equator',w:'It crosses Africa through Gabon, Congo, DR Congo, Uganda, Kenya and Somalia.'}
],
s:[
 {q:'What is the Earth\'s innermost layer, and what is it mainly made of?',a:'The inner core, made of solid iron and nickel',w:'It is about as hot as the surface of the Sun, but stays solid because of the enormous pressure.'},
 {q:'What theory explains how the continents slowly move?',a:'Plate tectonics',w:'The East African Rift is a plate boundary. Africa is slowly splitting apart there.'},
 {q:'About how long does light from the Sun take to reach Earth?',a:'About 8 minutes',w:'So if the Sun went out, we would not know for 8 minutes.'},
 {q:'Which gas makes up about 78% of the air?',a:'Nitrogen',w:'Oxygen is only about 21%. Carbon dioxide is less than 0.05%.'},
 {q:'What is the name of the galaxy we live in?',a:'The Milky Way',w:'It holds a few hundred billion stars. The Sun is one of them.'},
 {q:'What causes the seasons?',a:'The tilt of the Earth\'s axis (about 23.5°)',w:'It is not the distance from the Sun. Earth is actually closest to the Sun in January.'},
 {q:'Which former planet was reclassified as a dwarf planet in 2006?',a:'Pluto',w:'It was demoted because it has not cleared other objects from its orbit.'},
 {q:'What does the Richter scale measure?',a:'The magnitude of an earthquake',w:'Each step up the scale is about 32 times more energy released. Scientists now mostly use the moment magnitude scale.'}
]},
matter:{
j:[
 {q:'What are the three forms water can take?',a:'Ice, liquid water and steam (water vapour)',w:'Solid, liquid and gas. Cold turns it to ice, heat turns it to steam.'},
 {q:'What happens to ice when it gets warm?',a:'It melts into water',w:'Melting happens at 0 °C.'},
 {q:'Which is heavier: a kilogram of stones or a kilogram of feathers?',a:'They weigh the same',w:'A kilogram is a kilogram. The feathers just take up more space.'},
 {q:'What do we call a push or a pull?',a:'A force',w:'Kicking a ball is a push. Opening a drawer is a pull.'},
 {q:'What force pulls things down to the ground?',a:'Gravity',w:'Gravity is also what keeps the Moon going round the Earth.'},
 {q:'Does a magnet stick to wood?',a:'No',w:'Magnets attract iron, steel and nickel, not wood, plastic or paper.'},
 {q:'What do we call it when heat turns a liquid into a gas?',a:'Evaporation (or boiling)',w:'Puddles disappear on a sunny day because the water evaporates.'},
 {q:'Name something besides the Moon that gives us light at night.',a:'Stars, a lamp, a torch, a fire, fireflies...',w:'Anything that gives off its own light is called a light source.'}

const SEG=8;
let age=null, topic=null, teamsN=0, timerS=30, teams=[], turn=0, muted=false;
let used={}; // key "topic:age" -> array of used indexes
let current=null, rot=0, spinning=false, revealed=false, timerId=null, timeLeft=0;

try{ const u=JSON.parse(localStorage.getItem('sabi-used')||'{}'); if(u&&typeof u==='object') used=u; }catch(e){}
try{ muted=localStorage.getItem('sabi-muted')==='1'; }catch(e){}
function saveUsed(){ try{localStorage.setItem('sabi-used',JSON.stringify(used));}catch(e){} }
const poolKey=()=>topic+':'+age;
const pool=()=>BANK[topic][age];
const usedList=()=>used[poolKey()]||[];
const remaining=()=>pool().length-usedList().length;

const $=id=>document.getElementById(id);

// ---------- sound ----------
let actx=null;
function ac(){ if(muted) return null; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }catch(e){return null;} }
function tone(f,dur,type,vol,when){ const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(vol||.15,c.currentTime+(when||0)); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(when||0)+dur); o.connect(g).connect(c.destination); o.start(c.currentTime+(when||0)); o.stop(c.currentTime+(when||0)+dur+.02); }
const sfx={
  tick(){ tone(1400,.03,'square',.05); },
  land(){ tone(520,.25,'triangle',.2); tone(780,.35,'triangle',.2,.12); },
  reveal(){ tone(660,.15,'sine',.2); tone(880,.3,'sine',.2,.12); },
  good(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.09)); },
  bad(){ tone(220,.3,'sawtooth',.12); tone(180,.4,'sawtooth',.12,.15); },
  buzz(){ tone(140,.6,'sawtooth',.2); }
};

// ---------- setup screen ----------
function build(){
  const ac=$('ageCards');
  AGES.forEach(a=>{ const b=document.createElement('button'); b.type='button'; b.className='card'; b.setAttribute('aria-pressed','false'); b.innerHTML='<span class="big">'+a.name+'</span><span class="sub">'+a.sub+'</span>'; b.onclick=()=>{age=a.key; refreshSetup();}; b.dataset.key=a.key; ac.appendChild(b); });
  TOPICS.forEach(t=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.group=t.group; b.dataset.key=t.key; b.setAttribute('aria-pressed','false'); b.innerHTML='<span>'+t.icon+'</span><span>'+t.name+'</span><span class="count"></span>'; b.onclick=()=>{topic=t.key; refreshSetup();}; (t.group==='Science'?$('sciChips'):$('afrChips')).appendChild(b); });
  $('teamSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{teamsN=+b.dataset.n; refreshSetup();});
  $('timerSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{timerS=+b.dataset.s; refreshSetup();});
  $('startBtn').onclick=start;
  $('resetBtn').onclick=()=>{ used={}; saveUsed(); refreshSetup(); $('resetBtn').textContent='Questions reset ✓'; setTimeout(()=>$('resetBtn').textContent='Reset used questions',1500); };
  $('newBtn').onclick=newSession;
  $('changeBtn').onclick=()=>{ stopTimer(); $('play').hidden=true; $('setup').hidden=false; refreshSetup(); };
  $('spinBtn').onclick=spin;
  $('muteBtn').onclick=()=>{ muted=!muted; try{localStorage.setItem('sabi-muted',muted?'1':'0');}catch(e){} $('muteBtn').textContent=muted?'🔇':'🔊'; };
  $('muteBtn').textContent=muted?'🔇':'🔊';
  $('fsBtn').onclick=()=>{ const el=document.documentElement; try{ if(document.fullscreenElement){document.exitFullscreen();} else if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); } }catch(e){} };
  let total=0; TOPICS.forEach(t=>AGES.forEach(a=>total+=BANK[t.key][a.key].length));
  $('bankNote').textContent=total+' questions in the bank: 8 per topic per age group. Used questions stay out until you reset them.';
  refreshSetup();
  window.addEventListener('resize',()=>drawWheel());
}
function refreshSetup(){
  $('ageCards').querySelectorAll('.card').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===age)));
  document.querySelectorAll('.chip').forEach(b=>{
    b.setAttribute('aria-pressed',String(b.dataset.key===topic));
    const c=b.querySelector('.count');
    if(age){ const u=(used[b.dataset.key+':'+age]||[]).length; const n=BANK[b.dataset.key][age].length; c.textContent=(n-u)+'/'+n; } else c.textContent='';
  });
  $('teamSeg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.n===teamsN)));
  $('timerSeg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===timerS)));
  const tn=$('teamNames'); tn.hidden=teamsN===0;
  if(teamsN){ const names=[...tn.querySelectorAll('input')].map(i=>i.value); tn.innerHTML=''; for(let i=0;i<teamsN;i++){ const inp=document.createElement('input'); inp.id='team'+i; inp.value=names[i]||'Team '+String.fromCharCode(65+i); inp.setAttribute('aria-label','Team '+(i+1)+' name'); tn.appendChild(inp);} }
  $('startBtn').disabled=!(age&&topic);
}

// ---------- play ----------
function start(){
  const prevKey=teams.map(t=>t.name).join('|');
  const names=[...$('teamNames').querySelectorAll('input')].map(i=>i.value.trim()||'Team');
  if(names.join('|')!==prevKey){ teams=names.map(n=>({name:n,score:0})); turn=0; }
  $('setup').hidden=true; $('play').hidden=false;
  $('ageLabel').textContent=AGES.find(a=>a.key===age).name+' · '+AGES.find(a=>a.key===age).sub;
  const t=TOPICS.find(t=>t.key===topic); $('topicLabel').textContent=t.icon+' '+t.name;
  renderScores(); resetCard(); drawWheel(); updateLeft();
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
}
function renderScores(){
  const s=$('scores'); s.hidden=teams.length===0; s.innerHTML='';
  teams.forEach((t,i)=>{ const d=document.createElement('div'); d.className='score'+(i===turn?' active':''); d.innerHTML='<span>'+esc(t.name)+'</span><span class="n">'+t.score+'</span>'; s.appendChild(d); });
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function updateLeft(){
  const r=remaining();
  $('leftNote').textContent=r===0?'All 8 questions used for this topic':r+' of '+pool().length+' questions left';
  $('spinBtn').disabled=r===0||spinning;
  if(r===0&&!current){
    const ph=$('placeholder'); ph.innerHTML='';
    const d=document.createElement('div'); d.className='done';
    d.innerHTML='<p style="margin:0 0 12px">Every question in this topic has been answered.'+(teams.length?' Final score: '+teams.map(t=>esc(t.name)+' '+t.score).join(' · ')+'.':'')+'</p>';
    const row=document.createElement('div'); row.className='actions'; row.style.marginTop='0';
    const c=document.createElement('button'); c.type='button'; c.className='primary'; c.textContent='Pick another topic'; c.onclick=()=>$('changeBtn').click();
    const n=document.createElement('button'); n.type='button'; n.className='ghost'; n.textContent='New session'; n.onclick=newSession;
    row.appendChild(c); row.appendChild(n); d.appendChild(row); ph.appendChild(d);
    ph.hidden=false; $('qbody').hidden=true;
  }
}
function newSession(){
  stopTimer(); used={}; saveUsed(); teams=[]; turn=0; current=null; age=null; topic=null; teamsN=0;
  $('play').hidden=true; $('setup').hidden=false; refreshSetup();
}
function resetCard(){
  current=null; revealed=false; stopTimer();
  $('placeholder').textContent=teams.length?esc(teams[turn].name)+', spin the wheel!':'Spin the wheel to get your first question.';
  $('placeholder').hidden=false; $('qbody').hidden=true; $('answerBox').hidden=true; $('actions').innerHTML=''; $('hub').textContent='?';
}

// ---------- wheel ----------
const cv=$('wheel'); const cx=cv.getContext('2d');
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawWheel(){
  const box=cv.parentElement.getBoundingClientRect(); const size=Math.max(100,Math.floor(box.width)); const dpr=window.devicePixelRatio||1;
  if(cv.width!==size*dpr){ cv.width=size*dpr; cv.height=size*dpr; }
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,size,size);
  const r=size/2, step=Math.PI*2/SEG, cols=[cssVar('--wheel-a'),cssVar('--wheel-b'),cssVar('--wheel-c'),cssVar('--wheel-d')];
  const u=topic&&age?usedList():[];
  for(let i=0;i<SEG;i++){
    const a0=rot+i*step, a1=a0+step, isUsed=u.includes(i);
    cx.beginPath(); cx.moveTo(r,r); cx.arc(r,r,r-2,a0,a1); cx.closePath();
    cx.fillStyle=isUsed?cssVar('--wheel-used'):cols[i%4]; cx.fill();
    cx.strokeStyle=cssVar('--surface'); cx.lineWidth=3; cx.stroke();
    cx.save(); cx.translate(r,r); cx.rotate(a0+step/2); cx.textAlign='right'; cx.textBaseline='middle';
    cx.fillStyle=isUsed?cssVar('--wheel-used-text'):cssVar('--wheel-text');
    cx.font='700 '+Math.round(size*.12)+'px '+cssVar('--display');
    cx.fillText(String(i+1),r*.82,0); cx.restore();
  }
  cx.beginPath(); cx.arc(r,r,r-2,0,Math.PI*2); cx.strokeStyle=cssVar('--fg'); cx.lineWidth=4; cx.stroke();
}
function spin(){
  if(spinning) return; const u=usedList(); const avail=[]; for(let i=0;i<SEG;i++) if(!u.includes(i)) avail.push(i);
  if(!avail.length) return;
  ac(); // unlock audio on tap
  const target=avail[Math.floor(Math.random()*avail.length)];
  const step=Math.PI*2/SEG; const jitter=(Math.random()-.5)*step*.6;
  // segment `target` centre must sit at the pointer (top, -π/2)
  const desired=(-Math.PI/2-(target+.5)*step+jitter);
  const norm=a=>((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const delta=norm(desired-rot); const turns=5+Math.floor(Math.random()*3);
  const startRot=rot, total=turns*Math.PI*2+delta, dur=3600+Math.random()*600, t0=performance.now();
  spinning=true; resetCard(); $('spinBtn').disabled=true; $('hub').textContent='…'; $('placeholder').textContent='Spinning…';
  let lastSeg=Math.floor(norm(rot)/step);
  function frame(now){
    const p=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-p,3);
    rot=startRot+total*e; drawWheel();
    const seg=Math.floor(norm(rot)/step); if(seg!==lastSeg){ sfx.tick(); lastSeg=seg; }
    if(p<1) requestAnimationFrame(frame); else land(target);
  }
  requestAnimationFrame(frame);
}
function land(i){
  spinning=false; sfx.land();
  used[poolKey()]=[...usedList(),i]; saveUsed(); drawWheel();
  current=i; revealed=false; $('hub').textContent=String(i+1);
  showQuestion(i); updateLeft();
}
function showQuestion(i){
  const q=pool()[i];
  $('placeholder').hidden=true; $('qbody').hidden=false; $('answerBox').hidden=true;
  $('qnum').textContent='Question '+(i+1); $('qtext').textContent=q.q; $('atext').textContent=q.a; $('wtext').textContent=q.w;
  const card=$('qcard'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  const acts=$('actions'); acts.innerHTML='';
  const rb=document.createElement('button'); rb.type='button'; rb.className='primary'; rb.textContent='Reveal answer'; rb.onclick=reveal; acts.appendChild(rb);
  startTimer();
}
function reveal(){
  if(revealed) return; revealed=true; stopTimer(); sfx.reveal();
  $('answerBox').hidden=false; const acts=$('actions'); acts.innerHTML='';
  if(teams.length){
    const g=document.createElement('button'); g.type='button'; g.className='btn-good'; g.textContent='✓ Correct, +1 '+teams[turn].name; g.onclick=()=>{teams[turn].score++; sfx.good(); nextTurn();};
    const b=document.createElement('button'); b.type='button'; b.className='btn-bad'; b.textContent='✗ Not this time'; b.onclick=()=>{sfx.bad(); nextTurn();};
    acts.appendChild(g); acts.appendChild(b);
  } else {
    if(remaining()){
      const n=document.createElement('button'); n.type='button'; n.className='primary'; n.textContent='Spin again'; n.onclick=()=>{resetCard(); updateLeft(); spin();}; acts.appendChild(n);
    } else {
      const c=document.createElement('button'); c.type='button'; c.className='primary'; c.textContent='Pick another topic'; c.onclick=()=>$('changeBtn').click();
      const s=document.createElement('button'); s.type='button'; s.className='ghost'; s.textContent='New session'; s.onclick=newSession;
      acts.appendChild(c); acts.appendChild(s);
    }
  }
}
function nextTurn(){ turn=(turn+1)%teams.length; renderScores(); resetCard(); updateLeft(); }

// ---------- timer ----------
function startTimer(){
  stopTimer(); const bar=$('timerBar'), clock=$('tclock'), fill=$('timerFill');
  if(!timerS){ bar.hidden=true; clock.textContent=''; return; }
  bar.hidden=false; timeLeft=timerS; fill.style.width='100%'; fill.classList.remove('low'); clock.textContent=timeLeft+' s';
  const t0=performance.now();
  timerId=setInterval(()=>{
    const el=(performance.now()-t0)/1000; timeLeft=Math.max(0,timerS-el);
    fill.style.width=(timeLeft/timerS*100)+'%'; clock.textContent=Math.ceil(timeLeft)+' s';
    if(timeLeft<=5) fill.classList.add('low');
    if(timeLeft<=0){ stopTimer(); clock.textContent='Time!'; sfx.buzz(); }
  },200);
}
function stopTimer(){ if(timerId){clearInterval(timerId); timerId=null;} }

build();
})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
